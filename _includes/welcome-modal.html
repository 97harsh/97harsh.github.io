<!-- Welcome Modal -->
<div id="welcome-overlay" class="welcome-overlay" style="display: none;">
  <div class="welcome-modal">
    <h2>Welcome to My Website</h2>
    <p>To enhance your reading experience, please select your preferred font style. You can change this anytime using the font toggle in the sidebar.</p>
    
    <div class="font-options">
      <div class="font-option" data-font="default">
        <h3>Default Font</h3>
        <p>Standard font optimized for general readability.</p>
      </div>
      <div class="font-option" data-font="opendyslexic">
        <h3>OpenDyslexic</h3>
        <p>Specially designed for readers with dyslexia.</p>
      </div>
    </div>
    
    <button id="continue-btn" class="continue-btn">Continue with Selected Font</button>
  </div>
</div>
